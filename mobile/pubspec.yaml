name: dha_vault
description: "DHA Vault - Production Secure Digital Document Locker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  file_picker: ^8.3.7
  qr_flutter: ^4.1.0
  crypto: ^3.0.3
  google_sign_in: ^7.2.0
  pdfrx: ^2.4.8
  image_picker: ^1.2.3
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/dha_vault_logo.png
    - assets/branding/dha_vault_icon.png
    - assets/branding/dha_vault_splash.png
